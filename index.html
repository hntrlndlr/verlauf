<html lang="de">

<style>
:root{
  color-scheme: light dark;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
  --bg:#f3f5f4; --surface:#fcfcfb; --ink:#14232a; --ink2:#44545b; --muted:#65747a;
  --line:#dde3e1; --line2:#c3cbc9;
  --accent:#1f5c5f; --accent-ink:#ffffff; --accent-soft:#e2eeed;
  --crit:#d03b3b; --crit-bg:#fdeceb; --crit-ink:#8a1c1c;
  --warn:#e0a100; --warn-bg:#fff4d9; --warn-ink:#6b4300;
  --good-bg:#e7f3e7; --good-ink:#006300;
  --s-phq:#2a78d6; --s-gad:#eb6834;
  --band:#f0efec; --grid:#e1e0d9; --axis:#c3c2b7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1213; --surface:#1a1a19; --ink:#eef1f0; --ink2:#c3c9c7; --muted:#9aa4a7;
    --line:#2c2f2e; --line2:#3d4241;
    --accent:#6cc2c5; --accent-ink:#0a1b1c; --accent-soft:#1c2e2f;
    --crit:#d03b3b; --crit-bg:#3a1c1c; --crit-ink:#ffb0ac;
    --warn:#fab219; --warn-bg:#3a2f10; --warn-ink:#f6cf72;
    --good-bg:#12301a; --good-ink:#7bd47b;
    --s-phq:#3987e5; --s-gad:#d95926;
    --band:#222221; --grid:#2c2c2a; --axis:#383835;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0 0 .6em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 56px max(20px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px;margin:8px 0 22px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.sub{color:var(--ink2);font-size:15px}
.muted{color:var(--muted)}
.small{font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--crit-bg);border-color:var(--crit);color:var(--crit-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.card h2{margin-bottom:4px}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-weight:600;margin-bottom:6px}
.field small{display:block;color:var(--muted);margin-top:5px;font-size:14px}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=date],select{width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line2);border-radius:10px;background:var(--bg);font-size:17px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.check{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;cursor:pointer}
.check small{display:block;color:var(--muted);font-size:14px}
.err{color:var(--crit-ink);background:var(--crit-bg);border:1px solid var(--crit);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.note{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:15px}
.note .btn{margin-top:10px}
.center{max-width:520px;margin:0 auto}
.lockbox{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 20px}

.controls{display:flex;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.controls .grow{flex:1;min-width:220px}
.controls select{width:auto;min-width:210px}
.list{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;min-height:72px}
.prow:hover{border-color:var(--line2)}
.prow .id{font:600 21px/1.2 var(--serif)}
.prow .meta{flex:1;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:15px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.c-phq i{background:var(--s-phq)} .chip.c-gad i{background:var(--s-gad)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:4px 10px;border-radius:8px;white-space:nowrap}
.badge b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1}
.badge.crit{background:var(--crit-bg);color:var(--crit-ink);border:1px solid var(--crit)} .badge.crit b{background:var(--crit);color:#fff}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn)} .badge.warn b{background:var(--warn);color:#2a1a00}
.badge.info{background:var(--accent-soft);color:var(--ink)} .badge.info b{background:var(--accent);color:var(--accent-ink)}
.badge.good{background:var(--good-bg);color:var(--good-ink)} .badge.good b{background:var(--good-ink);color:var(--good-bg)}
.empty{text-align:center;padding:40px 20px;color:var(--ink2)}

.flags{display:flex;flex-direction:column;gap:10px}
.flag{display:flex;gap:12px;align-items:flex-start}
.flag .badge{flex:none;margin-top:1px}
.flag p{margin:0}

.stat{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin:6px 0 10px;color:var(--ink2);font-size:15px}
.stat .big{font:600 34px/1 var(--serif);color:var(--ink)}
.chart{position:relative}
.chart-svg{display:block;width:100%;height:auto;overflow:visible;touch-action:manipulation}
.band-a{fill:transparent} .band-b{fill:var(--band)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1.5}
.ax-y,.ax-x,.ax-band{fill:var(--muted);font:11.5px var(--sans)}
.val{fill:var(--ink);font:600 13px var(--sans)}
.line-phq{stroke:var(--s-phq)} .line-gad{stroke:var(--s-gad)}
.pt-phq{fill:var(--s-phq)} .pt-gad{fill:var(--s-gad)}
.pt{stroke:var(--surface);stroke-width:2}
.ring{fill:none;stroke:var(--crit);stroke-width:2}
.guide{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 3}
.hit{fill:transparent;cursor:pointer;outline:none}
.hit:focus-visible{stroke:var(--accent);stroke-width:2}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.35;transform:translate(-50%,-100%);white-space:nowrap}
.legend{font-size:14px;color:var(--ink2);margin-top:6px;display:flex;align-items:center;gap:8px}
.legend svg{flex:none}

.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{font-weight:600;text-align:left;color:var(--ink2);font-size:14px;padding:6px 10px;border-bottom:1.5px solid var(--line2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num{font-variant-numeric:tabular-nums}
.tbl .q9{color:var(--crit-ink);font-weight:600}
.scroll-x{overflow-x:auto}

.modal-back{position:fixed;inset:0;background:rgba(10,18,20,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal h2{margin-bottom:12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Fragebogen-Ansicht */
.flow{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.prog{height:6px;background:var(--line)} .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.flow-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 20px 0;max-width:760px;width:100%;margin:0 auto}
.flow-main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:760px;margin:0 auto;padding:20px 20px 40px}
.flow-kicker{color:var(--ink2);font-size:15px;margin-bottom:6px}
.flow-intro{color:var(--ink2);font-size:16px;margin-bottom:18px}
.q-text{font:600 clamp(24px,3.6vw,33px)/1.3 var(--serif);margin:0 0 26px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:18px;width:100%;min-height:68px;padding:12px 20px;text-align:left;background:var(--surface);border:1.5px solid var(--line2);border-radius:14px;font-size:19px;cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.dots{display:inline-flex;gap:5px;flex:none;min-width:58px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.flow-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
.crisis{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px;color:var(--ink2);margin:22px 0 0;text-align:left}
.thanks h1{font-size:34px;margin-bottom:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:28px 0}
@media (max-width:640px){
  h1{font-size:26px}
  .prow{flex-wrap:wrap}
  .controls select{width:100%}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<noscript>Diese App benötigt JavaScript.</noscript>
<script>
(() => {
'use strict';

const VERSION = '1.0.0';
const DB_NAME = 'verlauf-fragebogen';
const KDF_ITER = 600000;
const MIN_PASS = 10;
const HIDDEN_LOCK_MS = 60 * 1000;
const FLOW_IDLE_MS = 15 * 60 * 1000;
const CRISIS_TEXT = 'Wenn Sie sich in einer akuten Krise befinden, sagen Sie es bitte sofort Ihrer Therapeutin oder Ihrem Therapeuten. Notruf: 112. TelefonSeelsorge (kostenfrei, rund um die Uhr): 0800 111 0 111 oder 0800 111 0 222.';

/* ===================== Fragebögen ===================== */
const FREQ = [
  { v: 0, l: 'Überhaupt nicht' },
  { v: 1, l: 'An einzelnen Tagen' },
  { v: 2, l: 'An mehr als der Hälfte der Tage' },
  { v: 3, l: 'Beinahe jeden Tag' }
];
const Q = {
  phq: {
    key: 'phq', short: 'PHQ-9', name: 'Depressive Beschwerden', max: 27,
    intro: 'Wie oft fühlten Sie sich im Verlauf der letzten 2 Wochen durch die folgenden Beschwerden beeinträchtigt?',
    options: FREQ,
    items: [
      'Wenig Interesse oder Freude an Ihren Tätigkeiten',
      'Niedergeschlagenheit, Schwermut oder Hoffnungslosigkeit',
      'Schwierigkeiten ein- oder durchzuschlafen oder vermehrter Schlaf',
      'Müdigkeit oder Gefühl, keine Energie zu haben',
      'Verminderter Appetit oder übermäßiges Bedürfnis zu essen',
      'Schlechte Meinung von sich selbst; Gefühl, ein Versager zu sein oder die Familie enttäuscht zu haben',
      'Schwierigkeiten, sich auf etwas zu konzentrieren, z. B. beim Lesen der Zeitung oder Fernsehen',
      'Waren Ihre Bewegungen oder Ihre Sprache so verlangsamt, dass es auch anderen auffallen würde? Oder waren Sie im Gegenteil „zappelig“ oder ruhelos und hatten dadurch einen erhöhten Bewegungsdrang?',
      'Gedanken, dass Sie lieber tot wären oder sich Leid zufügen möchten'
    ],
    bands: [[0, 'minimal'], [5, 'leicht'], [10, 'mittelschwer'], [15, 'ziemlich schwer'], [20, 'schwer']]
  },
  gad: {
    key: 'gad', short: 'GAD-7', name: 'Ängstliche Beschwerden', max: 21,
    intro: 'Wie oft fühlten Sie sich im Verlauf der letzten 2 Wochen durch die folgenden Beschwerden beeinträchtigt?',
    options: FREQ,
    items: [
      'Nervosität, Ängstlichkeit oder Anspannung',
      'Nicht in der Lage sein, Sorgen zu stoppen oder zu kontrollieren',
      'Übermäßige Sorgen bezüglich verschiedener Angelegenheiten',
      'Schwierigkeiten zu entspannen',
      'Rastlosigkeit, so dass Stillsitzen schwer fällt',
      'Schnelle Verärgerung oder Gereiztheit',
      'Gefühl der Angst, so als würde etwas Schlimmes passieren'
    ],
    bands: [[0, 'minimal'], [5, 'leicht'], [10, 'mittelschwer'], [15, 'schwer']]
  },
  ses: {
    key: 'ses', short: 'Sitzungsfragen', name: 'Sitzungsfragen (eigene Kurzfragen, nicht validiert)', max: 12,
    intro: 'Bitte denken Sie an die heutige Sitzung. Wie sehr treffen die folgenden Aussagen zu?',
    options: [
      { v: 0, l: 'Gar nicht' }, { v: 1, l: 'Eher wenig' }, { v: 2, l: 'Teils, teils' },
      { v: 3, l: 'Überwiegend' }, { v: 4, l: 'Völlig' }
    ],
    items: [
      'Ich habe mich in der Sitzung verstanden und respektiert gefühlt.',
      'Wir haben an dem gearbeitet, was mir wichtig ist.',
      'Die Art, wie wir gearbeitet haben, passt zu mir.'
    ],
    bands: []
  }
};
const KEYS = ['phq', 'gad', 'ses'];

/* ===================== Hilfsfunktionen ===================== */
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const te = new TextEncoder(), td = new TextDecoder();

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function s(tag, attrs, ...kids) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function b64e(buf) {
  const b = new Uint8Array(buf); let str = '';
  for (let i = 0; i < b.length; i += 0x8000) str += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(str);
}
function b64d(str) {
  const bin = atob(str); const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const x = [...b].map(n => n.toString(16).padStart(2, '0')).join('');
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const fmtDate = ts => new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtShort = ts => new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
const signed = n => n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '±0';
function fmtWeeks(w) {
  if (w < 1) return 'weniger als 1 Woche';
  const n = Math.round(w);
  return n === 1 ? '1 Woche' : n + ' Wochen';
}
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignorieren */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignorieren */ } }
};

/* ===================== Einstellungen & Backup-Info ===================== */
const DEFAULTS = { idleMin: 5, phq: true, gad: true, ses: false, phqChange: 5, gadChange: 4, relevant: 10, minN: 5, weeks: 8 };
const cfg = Object.assign({}, DEFAULTS);
function loadCfg() {
  try {
    const o = JSON.parse(LS.get('verlauf.settings') || '{}');
    for (const k of Object.keys(DEFAULTS)) if (typeof o[k] === typeof DEFAULTS[k]) cfg[k] = o[k];
  } catch (e) { /* Standardwerte */ }
}
const saveCfg = () => LS.set('verlauf.settings', JSON.stringify(cfg));
function getBk() {
  try { const o = JSON.parse(LS.get('verlauf.backup') || '{}'); return { at: o.at || null, changes: Number(o.changes) || 0 }; }
  catch (e) { return { at: null, changes: 0 }; }
}
const setBk = o => LS.set('verlauf.backup', JSON.stringify(o));
function bumpChanges() { const b = getBk(); b.changes++; setBk(b); }

/* ===================== Auswertung (rein, ohne Seiteneffekte) ===================== */
function recScore(rec, k) {
  const a = rec && rec[k];
  if (!Array.isArray(a) || a.length !== Q[k].items.length) return null;
  let sum = 0;
  for (const v of a) { if (!Number.isInteger(v)) return null; sum += v; }
  return sum;
}
function bandOf(k, score) {
  let name = '';
  for (const b of Q[k].bands) if (score >= b[0]) name = b[1];
  return name;
}
function analyze(recs, c) {
  const res = { n: recs.length, flags: [], series: { phq: [], gad: [] }, level: 'none', first: null, last: null, weeks: 0 };
  if (!recs.length) return res;
  res.first = recs[0]; res.last = recs[recs.length - 1];
  res.weeks = (Date.parse(res.last.ts) - Date.parse(res.first.ts)) / (7 * 864e5);
  for (const k of ['phq', 'gad']) for (const r of recs) {
    const sc = recScore(r, k);
    if (sc !== null) res.series[k].push({ rec: r, score: sc, ts: r.ts });
  }
  const add = (level, code, short, text) => res.flags.push({ level, code, short, text });

  const lp = res.last.phq;
  if (Array.isArray(lp) && lp.length === 9) {
    const v = lp[8];
    if (v === null || v === undefined) add('warn', 'item9_missing', 'Frage 9 offen', 'PHQ-9, Frage 9 (Gedanken an Tod oder Selbstverletzung) wurde nicht beantwortet.');
    else if (v > 0) add('critical', 'item9', 'Frage 9 positiv', `PHQ-9, Frage 9 (Gedanken an Tod oder Selbstverletzung) ist positiv: „${FREQ[v].l}“. Bitte in dieser Sitzung abklären.`);
  }
  for (const k of ['phq', 'gad']) {
    const ser = res.series[k]; if (!ser.length) continue;
    const L = Q[k].short, thr = c[k + 'Change'];

    }

  }

}

  pts.forEach((p, i) => { if (i % step === 0 || i === n - 1) svg.append(s('text', { x: X(i), y: H - B + 20, class: 'ax-x', 'text-anchor': 'middle' }, fmtShort(p.ts))); });

  pts.forEach((p, i) => {

function groupRecords() {
  const m = new Map();
  for (const r of state.records) { if (!m.has(r.pid)) m.set(r.pid, []); m.get(r.pid).push(r); }

  return 'P-' + String(mx + 1).padStart(3, '0');
}

}

/* ---- Fragebogen-Ablauf ---- */
function startFlow(pid, mode) {
  const inst = KEYS.filter(k => cfg[k]);
  if (!inst.length) { toast('Es ist kein Fragebogen aktiviert (Einstellungen).'); return; }
  const steps = [{ t: 'intro' }];
  inst.forEach(k => Q[k].items.forEach((_, idx) => steps.push({ t: 'q', k, idx })));
  steps.push({ t: 'review' });
  const ans = {}; inst.forEach(k => { ans[k] = new Array(Q[k].items.length).fill(undefined); });
  closeModal();
  go('flow', { pid, flow: { pid, mode, inst, ans, steps, i: 0, date: todayStr(), busy: false } });
}
function abortFlow() {
  const f = state.flow;
  if (f.mode === 'patient') lock(); else go(state.records.some(r => r.pid === f.pid) ? 'patient' : 'home', { flow: null, pid: f.pid });
}
function answer(v) {
  const f = state.flow; if (f.busy) return;
  const st = f.steps[f.i]; f.ans[st.k][st.idx] = v; f.busy = true; render({ keep: true });
  setTimeout(() => { f.busy = false; if (state.flow === f) { f.i++; render(); } }, 170);
}
async function submitFlow(btn) {
  const f = state.flow; btn.disabled = true;
  const ts = f.date === todayStr() ? new Date().toISOString() : new Date(f.date + 'T12:00:00').toISOString();
  const fix = k => f.ans[k] ? f.ans[k].map(v => Number.isInteger(v) ? v : null) : null;
  const rec = { id: uuid(), pid: f.pid, ts, phq: fix('phq'), gad: fix('gad'), ses: fix('ses'), src: f.mode };
  try { await saveRecord(rec); }
  catch (e) { btn.disabled = false; toast('Speichern fehlgeschlagen: ' + (e && e.message || e)); return; }
  state.flow = null;
  if (f.mode === 'patient') lock('thanks', f.pid);
  else { go('patient', { pid: f.pid }); toast('Messung gespeichert.'); }
}

  } else if (st.t === 'q') {

  const file = h('input', { type: 'file', id: 'restore-file', accept: '.json,application/json,text/plain' });

    replaceWarning ? h('div', { class: 'note' }, 'Alle aktuell gespeicherten Daten auf diesem Gerät werden durch das Backup ersetzt.') : null, err,
    h('label', { class: 'field' }, h('span', null, 'Backup-Datei'), file),
    h('label', { class: 'field' }, h('span', null, 'Passphrase des Backups'), pass, h('small', null, 'Es zählt die Passphrase, die beim Erstellen des Backups galt.'))), actions: [
    { label: 'Abbrechen' },
    { label: 'Wiederherstellen', kind: 'primary', id: 'restore-ok', run: async () => {
      err.hidden = true;
      if (!file.files[0]) { err.textContent = 'Bitte eine Backup-Datei wählen.'; err.hidden = false; return false; }
      if (!pass.value) { err.textContent = 'Bitte die Passphrase eingeben.'; err.hidden = false; return false; }
      let text; try { text = await file.files[0].text(); } catch (e) { err.textContent = 'Datei konnte nicht gelesen werden.'; err.hidden = false; return false; }
      await sleep(30);
      const r = await importBackup(text, pass.value);
      if (!r.ok) { err.textContent = r.err; err.hidden = false; return false; }
      go('home'); toast(`${r.count} Messung${r.count === 1 ? '' : 'en'} wiederhergestellt` + (r.bad ? `, ${r.bad} nicht lesbar.` : '.'));
    } }] });
}
function openChangePass() {
  const o = passField('cp-old', 'Aktuelle Passphrase', 'current-password', { 'data-autofocus': '1' });
  const n1 = passField('cp-new', 'Neue Passphrase', 'new-password');
  const n2 = passField('cp-new2', 'Neue Passphrase wiederholen', 'new-password');
  const err = h('div', { class: 'err', hidden: true, role: 'alert' });
  modal({ title: 'Passphrase ändern', content: h('div', null, err, o, n1, n2,
    h('div', { class: 'note' }, 'Alle Daten werden neu verschlüsselt. Alte Backups bleiben mit der alten Passphrase verschlüsselt, bitte danach ein neues Backup erstellen.')), actions: [
    { label: 'Abbrechen' },
    { label: 'Ändern', kind: 'primary', id: 'cp-ok', run: async () => {
      err.hidden = true;
      const msg = validatePass($('input', n1).value, $('input', n2).value);
      if (msg) { err.textContent = msg; err.hidden = false; return false; }
      await sleep(30);
      const r = await changePass($('input', o).value, $('input', n1).value);
      if (r === 'old') { err.textContent = 'Die aktuelle Passphrase stimmt nicht.'; err.hidden = false; return false; }
      if (r === 'corrupt') { err.textContent = 'Einige Einträge sind nicht lesbar. Bitte zuerst ein Backup erstellen und die Daten prüfen.'; err.hidden = false; return false; }
      toast('Passphrase geändert. Bitte neues Backup erstellen.');
    } }] });
}
function openWipe() {
  const input = h('input', { type: 'text', id: 'wipe-input', autocomplete: 'off', autocapitalize: 'characters' });
  modal({ title: 'Alle Daten löschen', content: h('div', null,
    h('p', null, 'Löscht alle Messungen und die Einrichtung auf diesem Gerät unwiderruflich. Backups bleiben bestehen.'),
    h('label', { class: 'field' }, h('span', null, 'Zur Bestätigung LÖSCHEN eintippen'), input)), actions: [
    { label: 'Abbrechen' },
    { label: 'Alles löschen', kind: 'danger', id: 'wipe-ok', run: async () => {
      if (input.value.trim().toUpperCase() !== 'LÖSCHEN') { toast('Bitte LÖSCHEN eintippen.'); return false; }
      await dbWipe(); LS.del('verlauf.backup');
      state.key = null; state.meta = null; state.records = []; state.rows = new Map(); state.pid = null;
      go('setup'); toast('Alles gelöscht.');
    } }] });
}
function viewSettings() {
  const numField = (label, key, min, max, help) => h('label', { class: 'field' }, h('span', null, label),
    h('input', { type: 'number', inputmode: 'numeric', min: String(min), max: String(max), value: String(cfg[key]), 'data-key': key,
      onchange: e => { const v = parseInt(e.target.value, 10); cfg[key] = Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : DEFAULTS[key]; e.target.value = cfg[key]; saveCfg(); } }),
    help ? h('small', null, help) : null);
  const qCheck = (k, label, help) => h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'cfg-' + k, checked: cfg[k] ? true : null,
    onchange: e => { if (!e.target.checked && !KEYS.filter(x => x !== k).some(x => cfg[x])) { e.target.checked = true; toast('Mindestens ein Fragebogen muss aktiv bleiben.'); return; } cfg[k] = e.target.checked; saveCfg(); } }),
    h('span', null, label, help ? h('small', null, help) : null));
  const bk = getBk();
  const persist = h('span', { class: 'muted' }, '…');
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { persist.textContent = p ? 'ja' : 'nicht bestätigt (Backups umso wichtiger)'; }).catch(() => { persist.textContent = 'unbekannt'; });
  else persist.textContent = 'unbekannt';
  return h('div', { class: 'wrap' },
    h('div', { class: 'top' }, h('button', { class: 'btn', id: 'btn-back', onclick: () => go('home') }, '‹ Übersicht'), h('div', { class: 'grow' }, h('h1', null, 'Einstellungen'))),
    h('div', { class: 'card' }, h('h2', null, 'Fragebögen'), h('p', { class: 'sub small' }, 'Gilt für jede neue Messung.'),
      qCheck('phq', 'PHQ-9 (Depression)'), qCheck('gad', 'GAD-7 (Angst)'),
      qCheck('ses', 'Sitzungsfragen', 'Drei eigene Kurzfragen zu Verstandenwerden, Zielen und Vorgehen. Nicht validiert, nur als Gesprächsanlass gedacht.')),
    h('div', { class: 'card' }, h('h2', null, 'Sicherheit'),
      h('label', { class: 'field', style: { marginTop: '10px' } }, h('span', null, 'Automatisch sperren nach'),
        h('select', { id: 'cfg-idle', onchange: e => { cfg.idleMin = parseInt(e.target.value, 10); saveCfg(); } },
          [1, 2, 5, 10, 15].map(m => h('option', { value: String(m), selected: cfg.idleMin === m }, m === 1 ? '1 Minute' : m + ' Minuten'))),
        h('small', null, 'Unabhängig davon sperrt die App nach 60 Sekunden im Hintergrund und nach jeder vom Tablet aus beantworteten Messung.')),
      h('p', { class: 'small' }, 'Dauerhafter Speicher: ', persist),
      h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap' } }, h('button', { class: 'btn', id: 'btn-changepass', onclick: openChangePass }, 'Passphrase ändern'))),
    h('div', { class: 'card' }, h('h2', null, 'Hinweis-Schwellen'),
      h('p', { class: 'sub small' }, 'Diese Werte steuern nur die automatischen Hinweise. Die Voreinstellungen stammen aus der Erinnerung des Entwicklers und sollten Sie anhand der Originalliteratur prüfen und anpassen.'),
      numField('Bedeutsame Veränderung PHQ-9 (Punkte)', 'phqChange', 1, 27),
      numField('Bedeutsame Veränderung GAD-7 (Punkte)', 'gadChange', 1, 21),
      numField('Relevanter Ausgangswert (Punkte)', 'relevant', 1, 27, 'Der Hinweis „keine Besserung“ erscheint nur, wenn die erste Messung mindestens so hoch war.'),
      numField('Messungen bis zum Hinweis „keine Besserung“', 'minN', 2, 50),
      numField('Oder Wochen seit der ersten Messung', 'weeks', 1, 104)),
    h('div', { class: 'card' }, h('h2', null, 'Backup'),
      h('p', { class: 'sub small' }, bk.at ? `Letztes Backup: ${fmtDate(bk.at)}, seitdem ${bk.changes} Änderung${bk.changes === 1 ? '' : 'en'}.` : 'Noch kein Backup erstellt.'),
      h('p', { class: 'small' }, 'Die Backup-Datei ist mit Ihrer Passphrase verschlüsselt. Speichern Sie sie z. B. in der Dateien-App oder auf einem Praxisrechner.'),
      h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap' } },
        h('button', { class: 'btn primary', id: 'btn-export', onclick: exportBackup }, 'Backup erstellen'),
        h('button', { class: 'btn', id: 'btn-restore', onclick: () => openRestore(true) }, 'Backup wiederherstellen'))),
    h('div', { class: 'card' }, h('h2', null, 'Daten löschen'),
      h('p', { class: 'small' }, 'Entfernt alle Messungen und die Einrichtung von diesem Gerät.'),
      h('button', { class: 'btn danger', id: 'btn-wipe', onclick: openWipe }, 'Alle Daten löschen')),
    h('div', { class: 'card' }, h('h2', null, 'Über diese App'),
      h('p', { class: 'small' }, `Version ${VERSION}. Läuft ohne Server: Die Daten verlassen dieses Gerät nur, wenn Sie selbst ein Backup exportieren.`),
      h('p', { class: 'small' }, 'Kein Medizinprodukt. Die Hinweise ersetzen keine klinische Einschätzung. Fragetexte bitte mit der offiziellen deutschen Fassung abgleichen.')));
}

/* ===================== Start ===================== */
const ACTIVITY = ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'];
ACTIVITY.forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  if (!state.key) return;
  const lim = state.view === 'flow' ? FLOW_IDLE_MS : cfg.idleMin * 60 * 1000;
  if (Date.now() - lastAct > lim) lock('timeout');
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else {
    if (state.key && hiddenAt && Date.now() - hiddenAt > HIDDEN_LOCK_MS) lock('timeout');
    hiddenAt = null; lastAct = Date.now();
  }
});

async function boot() {
  loadCfg();
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) { state.fatal = 'Verschlüsselung ist in diesem Browser-Kontext nicht verfügbar. Die App muss über https geöffnet werden.'; return go('fatal'); }
  if (!window.indexedDB) { state.fatal = 'Dieser Browser bietet keinen lokalen Speicher (IndexedDB). Ein privates Fenster kann die Ursache sein.'; return go('fatal'); }
  try { db = await openDB(); } catch (e) { state.fatal = 'Der lokale Speicher konnte nicht geöffnet werden: ' + (e && e.message || e); return go('fatal'); }
  let meta = null;
  try { meta = await dbGetMeta(); } catch (e) { /* leer */ }
  go(meta ? 'lock' : 'setup');
  if ('serviceWorker' in navigator) {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Offline-Cache weiter */ });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('App aktualisiert. Beim nächsten Start aktiv.'); });
  }
}
window.__pm = { Q, DEFAULTS, recScore, bandOf, analyze, normPid, VERSION };
boot();
})();
